version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-destiny_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destiny_password}
      POSTGRES_DB: ${POSTGRES_DB:-destiny_rising_hub}
    ports:
      # - "${POSTGRES_PORT:-5432}:5432"  # Disabled to prevent port conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destiny_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destiny-network

  # ═══════════════════════════════════════════════════════════════
  # Redis (Cache + BullMQ)
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destiny-network

  # ═══════════════════════════════════════════════════════════════
  # MinIO (S3-compatible Object Storage)
  # ═══════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destiny-network

  # ═══════════════════════════════════════════════════════════════
  # Mailpit (SMTP Testing)
  # ═══════════════════════════════════════════════════════════════
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - destiny-network

  # ═══════════════════════════════════════════════════════════════
  # Application (Next.js — Development)
  # ═══════════════════════════════════════════════════════════════
  app:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-destiny_user}:${POSTGRES_PASSWORD:-destiny_password}@postgres:5432/${POSTGRES_DB:-destiny_rising_hub}?schema=public
      REDIS_URL: redis://redis:6379
      BULLMQ_REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-destiny-assets}
      S3_REGION: ${S3_REGION:-us-east-1}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ${SMTP_FROM:-noreply@destinyrisinghub.com}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-key-change-in-production-min-32-chars}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Destiny Rising Hub}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - destiny-network
    command: >
      sh -c "
        npm install &&
        npx prisma generate &&
        npx prisma db push --accept-data-loss &&
        npx tsx prisma/seed.ts &&
        npm run dev
      "

  # ═══════════════════════════════════════════════════════════════
  # Redis Commander (Redis GUI - Optional)
  # ═══════════════════════════════════════════════════════════════
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_GUI_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - destiny-network
    profiles:
      - tools

networks:
  destiny-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailpit_data:
  node_modules_data:
  next_cache:
